name: Build Terrain Elevate Native CAD

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_occt_cad.py"
      - "scripts/analyze_vehicle_requirements.py"
      - "scripts/simulate_smooth_stair_climb.py"
      - "scripts/audit_assembly_connectivity.py"
      - "scripts/export_simulation_package.py"
      - "scripts/validate_simulation_package.py"
      - "scripts/generate_matlab_package.py"
      - "scripts/audit_design_acceptance.py"
      - "scripts/audit_physics_basis.py"
      - "scripts/audit_power_budget.py"
      - "scripts/audit_stair_control_state_machine.py"
      - "scripts/simulate_dynamic_contact.py"
      - "requirements-dynamics.txt"
      - "src/terrain_elevate/**"
      - "validate_outputs.py"
      - "data/te_v059_parameters.json"
      - "data/te_v059_load_cases.json"
      - "data/te_v059_mass_properties.json"
      - "data/te_v059_sourced_part_register.json"
      - "data/te_v059_physics_elements.json"
      - "data/te_v059_electrical_system.json"
      - "requirements-cad.txt"
      - "requirements-sim.txt"
      - ".github/workflows/build-native-cad.yml"
  push:
    paths:
      - "scripts/build_occt_cad.py"
      - "scripts/analyze_vehicle_requirements.py"
      - "scripts/simulate_smooth_stair_climb.py"
      - "scripts/audit_assembly_connectivity.py"
      - "scripts/export_simulation_package.py"
      - "scripts/validate_simulation_package.py"
      - "scripts/generate_matlab_package.py"
      - "scripts/audit_design_acceptance.py"
      - "scripts/audit_physics_basis.py"
      - "scripts/audit_power_budget.py"
      - "scripts/audit_stair_control_state_machine.py"
      - "scripts/simulate_dynamic_contact.py"
      - "requirements-dynamics.txt"
      - "src/terrain_elevate/**"
      - "validate_outputs.py"
      - "data/te_v059_parameters.json"
      - "data/te_v059_load_cases.json"
      - "data/te_v059_mass_properties.json"
      - "data/te_v059_sourced_part_register.json"
      - "data/te_v059_physics_elements.json"
      - "data/te_v059_electrical_system.json"
      - "requirements-cad.txt"
      - "requirements-sim.txt"
      - ".github/workflows/build-native-cad.yml"

jobs:
  build-occt-cad:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCCT CAD stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cad.txt
          python -m pip install -r requirements-sim.txt
          python -m pip install -r requirements-dynamics.txt

      - name: Build Fusion-ready prototype CAD
        run: |
          python scripts/analyze_vehicle_requirements.py
          python scripts/simulate_smooth_stair_climb.py
          python scripts/build_occt_cad.py
          python scripts/audit_fold_envelope.py
          python scripts/audit_power_budget.py
          python scripts/export_isometric_view.py || echo "isometric SVG export failed (non-blocking)"
          python scripts/export_simulation_package.py
          python scripts/generate_matlab_package.py

      - name: Validate outputs - validate_outputs.py
        run: python validate_outputs.py

      - name: Validate outputs - audit_assembly_connectivity.py
        run: python scripts/audit_assembly_connectivity.py

      - name: Validate outputs - audit_physics_basis.py
        run: python scripts/audit_physics_basis.py

      - name: Validate outputs - audit_stair_control_state_machine.py
        run: python scripts/audit_stair_control_state_machine.py

      - name: Validate outputs - validate_simulation_package.py
        run: python scripts/validate_simulation_package.py

      - name: Dynamic contact simulation - simulate_dynamic_contact.py
        run: python scripts/simulate_dynamic_contact.py

      - name: Validate outputs - audit_design_acceptance.py
        run: python scripts/audit_design_acceptance.py

      - name: Validate outputs - list artifacts
        run: |
          find cad_out -maxdepth 2 -type f -print
          find sim_out -maxdepth 2 -type f -print

      - name: Upload Fusion-ready CAD files
        uses: actions/upload-artifact@v4
        with:
          name: TerrainElevate-P1-V059-OCCT-Fusion-Ready
          path: |
            cad_out/Terrain_Elevate_P1_V0_59_OCCT.step
            cad_out/Terrain_Elevate_P1_V0_59_OCCT.stl
            cad_out/Terrain_Elevate_P1_V0_59_stair_climb_pose.step
            cad_out/Terrain_Elevate_P1_V0_59_stair_climb_pose.stl
            cad_out/Terrain_Elevate_P1_V0_59_package.dxf
            cad_out/Terrain_Elevate_P1_V0_59_manifest.json
            analysis_out/Terrain_Elevate_P1_V0_59_requirements_screen.json
            analysis_out/Terrain_Elevate_P1_V0_59_stair_phase_actuator_sweep.csv
            analysis_out/Terrain_Elevate_P1_V0_59_smooth_climb_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_smooth_climb_trajectory.csv
            analysis_out/Terrain_Elevate_P1_V0_59_fold_envelope_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_power_budget_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_stair_control_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_dynamic_contact_audit.json
            data/te_v059_electrical_system.json
            analysis_out/Terrain_Elevate_P1_V0_59_connectivity_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_physics_basis_audit.json
            analysis_out/Terrain_Elevate_P1_V0_59_design_acceptance_audit.json
            data/te_v059_sourced_part_register.json
            data/te_v059_physics_elements.json
            sim_out/Terrain_Elevate_P1_V0_59_sim.urdf
            sim_out/Terrain_Elevate_P1_V0_59_joint_graph.json
            sim_out/load_terrain_elevate_matlab.m
            sim_out/MATLAB_SOLIDWORKS_IMPORT_NOTES.json
            sim_out/meshes/*.stl
          if-no-files-found: error

      - name: Upload isometric view renders
        uses: actions/upload-artifact@v4
        with:
          name: TerrainElevate-P1-V059-Isometric-Views
          path: |
            cad_out/Terrain_Elevate_P1_V0_59_isometric.svg
            cad_out/Terrain_Elevate_P1_V0_59_stair_climb_pose_isometric.svg
            cad_out/Terrain_Elevate_P1_V0_59_folded_pose_isometric.svg
          if-no-files-found: warn

      # The audit JSONs are committed for the same reason the renders are: so
      # the current engineering status is readable directly on GitHub without
      # downloading a build artifact. That matters more than usual here --
      # several screens intentionally report FAIL while exiting 0, so a green
      # workflow conclusion says nothing about what they actually found.
      - name: Commit audit results to docs/audits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          for a in smooth_climb_audit power_budget_audit design_acceptance_audit                    stair_control_audit dynamic_contact_audit fold_envelope_audit                    connectivity_audit physics_basis_audit requirements_screen; do
            src="analysis_out/Terrain_Elevate_P1_V0_59_${a}.json"
            [ -s "$src" ] && cp "$src" "docs/audits/${a}.json" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits
          if git diff --cached --quiet; then
            echo "audits unchanged"
          else
            git commit -m "Update audit results [skip ci]"
            git push
          fi

      # Renders are committed into the repo (not just left as run artifacts)
      # so the current design is viewable directly on GitHub without
      # downloading a build. Guarded with [skip ci] and a paths-ignore on
      # docs/renders so this cannot retrigger itself.
      - name: Render PNGs and commit to docs/renders
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p docs/renders
          for view in isometric stair_climb_pose_isometric folded_pose_isometric; do
            src="cad_out/Terrain_Elevate_P1_V0_59_${view}.svg"
            [ -s "$src" ] || continue
            rsvg-convert -w 1600 -b white "$src" -o "docs/renders/${view}.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/renders
          if git diff --cached --quiet; then
            echo "renders unchanged"
          else
            git commit -m "Update CAD isometric renders [skip ci]"
            git push
          fi
