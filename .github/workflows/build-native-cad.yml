name: Build Terrain Elevate Native CAD

on:
  workflow_dispatch:
  push:
    paths:
      - "build_te_v059_freecad.py"
      - "validate_outputs.py"
      - "data/te_v059_parameters.json"
      - ".github/workflows/build-native-cad.yml"

jobs:
  build-step:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install FreeCAD/OpenCascade
        run: |
          sudo apt-get update
          sudo apt-get install -y freecad

      - name: Build native CAD
        run: |
          mkdir -p scripts
          cp build_te_v059_freecad.py scripts/build_te_v059_freecad.py
          mkdir -p cad_out
          if command -v freecadcmd >/dev/null 2>&1; then
            freecadcmd scripts/build_te_v059_freecad.py
          else
            FreeCADCmd scripts/build_te_v059_freecad.py
          fi

      - name: Validate outputs
        run: |
          python3 validate_outputs.py
          find cad_out -maxdepth 2 -type f -print

      - name: Upload Fusion-ready CAD files
        uses: actions/upload-artifact@v4
        with:
          name: TerrainElevate-P1-V059-Fusion-Ready
          path: |
            cad_out/Terrain_Elevate_V0_59.step
            cad_out/Terrain_Elevate_V0_59_native.FCStd
            cad_out/Terrain_Elevate_V0_59_manifest.json
          if-no-files-found: error
